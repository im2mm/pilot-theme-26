<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PILOT Theme 26</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 32px 16px; background: #f5f7fb; color: #333; }
  main { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 4px rgba(0,0,0,.15); }
  h1 { margin-top: 0; color: #07163D; }
  code { background: #eef2f8; padding: 2px 6px; border-radius: 4px; }
</style>

<body>
<main>
  <h1>PILOT Theme 26</h1>
  <p>A PILOT extension that makes PILOT look like gps.im2m.ws: a navy left sidebar, status tiles, Open Sans, blue headers and cards.</p>
  <p><strong>Entry file:</strong> <a href="Module.js">Module.js</a> (defines <code>Store.pilot_theme_26.Module</code>)</p>
  <p><strong>Register in PILOT Admin:</strong> Name <code>pilot_theme_26</code>, URL = this folder's address.</p>
  <p><a href="doc/">Documentation</a></p>
</main>
</body>
</html>
